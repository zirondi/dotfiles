# -----------------------------------------------------------
# Linux Specific Kitty Configuration
# -----------------------------------------------------------

# On Linux, map macOS-like 'Cmd' shortcuts using the 'Super' key (which kitty maps to 'cmd').
# This keeps your muscle memory consistent across systems.

# Copy/Paste
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Window/Tab Management
map cmd+t new_tab
map cmd+w close_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Line jumping (similar to macOS Cmd+Left/Right)
map cmd+left send_text all \x01
map cmd+right send_text all \x05

# Delete to beginning of line (similar to macOS Cmd+Backspace)
map cmd+backspace send_text all \x15
