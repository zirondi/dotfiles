# -----------------------------------------------------------
# Apple Glassmorphism Theme for Kitty
# -----------------------------------------------------------

# --- Typography ---
font_family           Cascadia Code
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             14.0

# If text looks blurry on a transparent background, it's often due to macOS disabling
# sub-pixel antialiasing. Removing or setting `macos_thicken_font` to 0 makes it sharper.
# Another option is tweaking `text_composition_strategy`.
# (Moved to macos.conf)

# --- Window & Glassmorphism ---
# Transparency and blur to create the frosted glass effect
background_opacity    0.65
background_blur       64
dynamic_background_opacity yes

# Spacing to let the blur shine and keep text readable
window_padding_width  14
window_margin_width   0
window_border_width   0
draw_minimal_borders  yes

# --- macOS Specific Aesthetics ---
# (Moved to macos.conf)

# --- Color Palette (Vibrant Dark Mode) ---
# A premium, sleek dark palette that perfectly complements the macOS blur
background            #121214
foreground            #F5F5F7
selection_background  #48484A
selection_foreground  #FFFFFF
cursor                #0A84FF
cursor_text_color     #FFFFFF

# Normal Colors
# 0: Black, 1: Red, 2: Green, 3: Yellow, 4: Blue, 5: Magenta, 6: Cyan, 7: White
color0                #48484A
color1                #FF453A
color2                #32D74B
color3                #FFD60A
color4                #0A84FF
color5                #BF5AF2
color6                #5E5CE6
color7                #F2F2F7

# Bright Colors
color8                #636366
color9                #FF453A
color10               #32D74B
color11               #FFD60A
color12               #0A84FF
color13               #BF5AF2
color14               #5E5CE6
color15               #FFFFFF

# -----------------------------------------------------------
# Advanced & Productivity Tweaks
# -----------------------------------------------------------

# --- Cursor ---
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.05 0.15

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1

# Cyberdream Tab Bar Colors
active_tab_foreground   #16181a
active_tab_background   #5ea1ff
inactive_tab_foreground #ffffff
inactive_tab_background #3c4048
tab_bar_background      #16181a
active_tab_font_style   bold

# --- URLs ---
url_style curly
detect_urls yes
show_hyperlink_targets yes

# --- Font Ligatures ---
# Disable ligatures when hovering over them with the cursor
disable_ligatures cursor

# --- Quality of Life ---
enable_audio_bell no
scrollback_lines 10000

# --- Universal Keybindings (Cross-Platform) ---
# Ensure Home/End navigate the line, Ctrl+Home/End navigate scrollback.
# These are overridden by OS-specific includes below if needed.
map home send_text all \x1b[H
map end  send_text all \x1b[F
map ctrl+home scroll_home
map ctrl+end  scroll_end

# --- OS Specific Includes ---
# Automatically loads either macos.conf or linux.conf depending on the OS
include ${KITTY_OS}.conf
allow_remote_control yes