# This file is used dynamically by the smart `remote` ZSH function
# when connecting to a remote Linux host that is missing its dotfiles.

# Include the base settings
include ssh.conf

# Automatically copy your lightweight ZSH configuration to remote hosts
hostname *
copy .zshrc .zshrc
copy .zprofile .zprofile
copy .zshrc_essentials .zshrc_essentials
copy .config/starship.toml .config/starship.toml
copy dotfiles/configs/zsh/shared dotfiles/configs/zsh/shared
copy dotfiles/configs/zsh/linux dotfiles/configs/zsh/linux
