# -----------------------------------------------------------
# macOS Specific Kitty Configuration
# -----------------------------------------------------------

# If text looks blurry on a transparent background, it's often due to macOS disabling
# sub-pixel antialiasing. Removing or setting `macos_thicken_font` to 0 makes it sharper.
# Another option is tweaking `text_composition_strategy`.
macos_thicken_font    0
text_composition_strategy legacy

# --- macOS Specific Aesthetics ---
# Blends the titlebar seamlessly into the blurred background
hide_window_decorations titlebar-only
macos_titlebar_color    background
macos_window_resizable  yes
macos_quit_when_last_window_closed yes

# Jump to beginning/end of line with Cmd+Left/Right
map cmd+left send_text all \x01
map cmd+right send_text all \x05

# No window title in the macOS menu bar: SketchyBar lists the menu bar items
# (configs/sketchybar/plugins/menus.sh) and would show it as an extra menu
macos_menubar_title_max_length 0
