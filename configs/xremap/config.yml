# xremap — Cmd-style app shortcuts on Linux (https://github.com/xremap/xremap)
#
# Super plays the role of macOS Cmd (configs/design/KEYMAP.md, "App layer").
# exact_match keeps Super+Ctrl+key (the i3 $mod layer) and Super+Shift+key
# combos that are not listed untouched.
# Terminals are excluded: Ctrl+C must stay SIGINT there, and Kitty already
# maps Super (cmd) itself in configs/kitty/linux.conf.
# Reloaded live: the service runs with --watch=config.

keymap:
  # Single-window GTK tools ignore Ctrl+W, so Cmd+W closes the window through
  # i3 instead (macOS closes the window there). Listed before the general map:
  # xremap applies the first keymap that matches.
  - name: Cmd+W closes windows that ignore Ctrl+W
    exact_match: true
    application:
      only: ['/(?i)nm-connection-editor|pavucontrol|blueman/']
    remap:
      Super-w:
        launch: ["/run/current-system/sw/bin/i3-msg", "kill"]

  # Steam ignores Ctrl+W and Ctrl+Q. Cmd+W closes its window and Cmd+Q quits;
  # in practice both end Steam (closing the window quits it), which is accepted
  # (configs/design/KEYMAP.md). xremap names the window steamwebhelper.steam.
  - name: Cmd+W / Cmd+Q in Steam
    exact_match: true
    application:
      only: ['/(?i)^steam/']
    remap:
      Super-w:
        launch: ["/run/current-system/sw/bin/i3-msg", "kill"]
      Super-q:
        launch: ["/run/current-system/sw/bin/steam", "-shutdown"]

  - name: Cmd shortcuts (Super → Ctrl)
    exact_match: true
    application:
      not: [kitty, rbw-menu]
    remap:
      # Edit
      Super-a: C-a
      Super-c: C-c
      Super-v: C-v
      Super-x: C-x
      Super-z: C-z
      Super-Shift-z: C-Shift-z
      Super-f: C-f
      Super-b: C-b
      Super-i: C-i
      Super-k: C-k
      # Files, windows, tabs
      Super-s: C-s
      Super-Shift-s: C-Shift-s
      Super-o: C-o
      Super-p: C-p
      Super-n: C-n
      Super-Shift-n: C-Shift-n
      Super-t: C-t
      Super-Shift-t: C-Shift-t
      Super-w: C-w
      Super-q: C-q
      Super-r: C-r
      Super-l: C-l
      # Zoom
      Super-equal: C-equal
      Super-minus: C-minus
      Super-0: C-0
      # Navigation
      Super-left: home
      Super-right: end
      Super-up: C-home
      Super-down: C-end
      Super-Shift-left: Shift-home
      Super-Shift-right: Shift-end
      Super-Shift-up: C-Shift-home
      Super-Shift-down: C-Shift-end
      Super-backspace: [Shift-home, backspace]
      Super-leftbrace: Alt-left
      Super-rightbrace: Alt-right
      Super-Shift-leftbrace: C-pageup
      Super-Shift-rightbrace: C-pagedown

  - name: Option word navigation (Alt → Ctrl)
    exact_match: true
    application:
      not: [kitty, rbw-menu]
    remap:
      Alt-left: C-left
      Alt-right: C-right
      Alt-Shift-left: C-Shift-left
      Alt-Shift-right: C-Shift-right
      Alt-backspace: C-backspace
