# -----------------------------------------------------------
# Classroom kitty (scripts/aula)
# -----------------------------------------------------------
# Opened with KITTY_CONFIG_DIRECTORY pointing at this directory, so the daily
# configs/kitty/kitty.conf is not read. Look: configs/design/THEME.md
# ("classroom terminal"); keys: configs/design/KEYMAP.md.

# --- Type ---
# Narrow, so more columns fit at projector sizes; no ligatures, so `!=` and
# `->` look like what students have to type
font_family      IosevkaTerm Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        22.0
disable_ligatures always

# --- Window ---
# Opaque: projectors and screen capture wash out transparency
background_opacity 1.0
background_blur    0
window_padding_width 10
enabled_layouts splits
draw_minimal_borders yes
window_border_width 1pt
active_border_color   #e04cc8
inactive_border_color #3a2577
# The history panel stays readable but steps back
inactive_text_alpha 0.75
confirm_os_window_close 0

# --- Colors: THEME.md tokens, ANSI palette from the daily kitty ---
background           #0e0b1c
foreground           #f5f5f7
cursor               #e04cc8
cursor_text_color    #0e0b1c
selection_background #582258
selection_foreground #f5f5f7
url_color            #0a84ff

color0  #48484a
color1  #ff453a
color2  #32d74b
color3  #ffd60a
color4  #0a84ff
color5  #bf5af2
color6  #5e5ce6
color7  #f2f2f7
color8  #636366
color9  #ff453a
color10 #32d74b
color11 #ffd60a
color12 #0a84ff
color13 #bf5af2
color14 #5e5ce6
color15 #ffffff

# --- Tabs (slides, terminal, scoreboard) ---
tab_bar_edge            top
tab_bar_style           separator
tab_separator           "  "
tab_bar_min_tabs        2
tab_bar_background      #0e0b1c
active_tab_background   #582258
active_tab_foreground   #f5f5f7
inactive_tab_background #0e0b1c
inactive_tab_foreground #8e8e93
active_tab_font_style   bold
# The label letter in its color (tab_bar.py)
tab_title_template      "{custom}"

# --- Cursor: steady, so it does not pull the eye on the projector ---
cursor_shape beam
cursor_blink_interval 0
cursor_trail 0

# New tabs and windows (Super+T for terminal [B]) get the class shell too;
# scripts/aula puts aula-shell on PATH
shell aula-shell

# --- Shell marks ---
# configs/aula/bashrc emits its own OSC 133 marks (they also work over ssh and
# in containers); kitty's injection would mark every command twice
shell_integration disabled
# Writes each command to the side panel (configs/aula/bin/aula-historico)
watcher historico.py

enable_audio_bell no
scrollback_lines 10000

# Same OS layer as the daily kitty (tabs, copy/paste, line jumps). Included
# before the keys below: linux.conf maps cmd+t too, and the last map wins
include ../kitty/${KITTY_OS}.conf

# --- Keys (KEYMAP.md, "Classroom terminal"); cmd is Super on Linux ---
map cmd+f1    change_font_size all 18.0
map cmd+f2    change_font_size all 22.0
map cmd+f3    change_font_size all 26.0
map cmd+f4    change_font_size all 30.0
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0     change_font_size all 22.0
# A new tab gets its own history panel, like the first one (aula.session).
# --next-to: a launch from a key goes next to the window the key was pressed
# in (the old tab); recent:0 is the active window of the new tab. The combine
# separator is | because the launch arguments contain ":"
map cmd+t     combine | new_tab | launch --next-to=recent:0 --location=vsplit --bias=25 --keep-focus --title Histórico aula-historico
